<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PF EXPERT CONSULTANCY</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><style>
*{box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
background:#f0f2f5;
margin:0;
display:flex;
justify-content:center;
animation:fadeIn 0.6s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.app-container{
width:100%;
max-width:480px;
background:#fff;
min-height:100vh;
box-shadow:0 0 30px rgba(0,0,0,0.1);
padding-bottom:80px;
}

/* HEADER */
header{
background:linear-gradient(135deg,#004a87,#002d54);
color:#fff;
padding:30px 20px;
text-align:center;
border-bottom-left-radius:40px;
border-bottom-right-radius:40px;
animation:slideDown 0.6s ease;
}
@keyframes slideDown{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}

.logo-img{
width:110px;height:110px;
border-radius:20px;
background:#fff;
padding:8px;
box-shadow:0 4px 15px rgba(0,0,0,0.3);
margin-bottom:10px;
}

/* BADGES */
.trust-badges{
display:flex;
justify-content:space-around;
margin:-20px 20px 10px;
background:#fff;
padding:15px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}
.badge-item{text-align:center}
.badge-item i{color:#ff9900;font-size:20px}

/* SERVICES */
.content{padding:15px}
.section-header{
font-weight:600;
color:#004a87;
margin:20px 0 10px;
border-left:4px solid #ff9900;
padding-left:10px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.service-item{
background:#fff;
border:1px solid #ddd;
padding:20px;
border-radius:15px;
text-align:center;
cursor:pointer;
transition:0.3s;
position:relative;
overflow:hidden;
}

.service-item:hover{
transform:translateY(-5px);
border-color:#25D366;
}

.service-item::after{
content:"";
position:absolute;
width:0%;
height:100%;
background:rgba(37,211,102,0.1);
top:0;left:0;
transition:0.4s;
}
.service-item:hover::after{width:100%}

.service-item i{
font-size:26px;
color:#004a87;
margin-bottom:8px;
}

/* BUTTON */
.contact-bar{
background:#25D366;
color:#fff;
text-align:center;
padding:15px;
font-weight:600;
position:fixed;
bottom:0;
width:100%;
max-width:480px;
cursor:pointer;
animation:pulse 2s infinite;
}
@keyframes pulse{
0%{box-shadow:0 0 0 0 rgba(37,211,102,0.5)}
70%{box-shadow:0 0 0 15px rgba(37,211,102,0)}
}

/* MODAL */
#customModal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
}

.modal-content{
background:#fff;
padding:20px;
border-radius:20px;
width:90%;
max-width:350px;
text-align:center;
animation:zoomIn 0.3s ease;
}
@keyframes zoomIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}

.btn{
padding:12px;
border:none;
border-radius:12px;
font-weight:600;
cursor:pointer;
margin-top:10px;
width:100%;
}

.btn-primary{background:#004a87;color:#fff}
.btn-whatsapp{background:#25D366;color:#fff}
.btn-cancel{background:#eee}

</style></head><body><div class="app-container"><header>
<img src="https://i.ibb.co/Bv93qMP/1000044934.png" class="logo-img">
<h2>PF EXPERT CONSULTANCY</h2>
<p style="font-size:12px;">Expert Help for Your PF Problems</p>
</header><div class="trust-badges">
<div class="badge-item"><i class="fas fa-check-circle"></i><br>2700+</div>
<div class="badge-item"><i class="fas fa-star"></i><br>4.7 Rating</div>
<div class="badge-item"><i class="fas fa-user-shield"></i><br>Verified</div>
</div><div class="content"><div class="section-header">Services</div><div class="grid">
<div class="service-item" onclick="openModal('Aadhar Linking',500)">
<i class="fas fa-id-card"></i>
<div>Aadhar Linking</div>
</div><div class="service-item" onclick="openModal('Mobile Link',150)">
<i class="fas fa-mobile"></i>
<div>Mobile Link</div>
</div><div class="service-item" onclick="openModal('PAN Link',400)">
<i class="fas fa-credit-card"></i>
<div>PAN Link</div>
</div><div class="service-item" onclick="openModal('Bank KYC',500)">
<i class="fas fa-university"></i>
<div>Bank KYC</div>
</div>
</div></div><div class="contact-bar" onclick="window.open('https://wa.me/919775515990')">
<i class="fab fa-whatsapp"></i> CONTACT ON WHATSAPP
</div></div><!-- MODAL --><div id="customModal">
<div class="modal-content">
<h3 id="serviceName"></h3>
<h2 id="price"></h2><button class="btn btn-primary" onclick="payNow()">Proceed to Pay</button>
<button class="btn btn-whatsapp" onclick="sendWhatsApp()">Send Screenshot</button>
<button class="btn btn-cancel" onclick="closeModal()">Cancel</button>

</div>
</div><script>

let currentService="";
let currentPrice="";

function openModal(service,price){
currentService=service;
currentPrice=price;

document.getElementById("serviceName").innerText=service;
document.getElementById("price").innerText="₹"+price;

document.getElementById("customModal").style.display="flex";
}

function closeModal(){
document.getElementById("customModal").style.display="none";
}

function payNow(){
alert("Scan QR & Pay (Add your QR here)");
}

function sendWhatsApp(){
let msg=`Hello Subir Sir, I paid ₹${currentPrice} for ${currentService}`;
window.open(`https://wa.me/917365996618?text=${encodeURIComponent(msg)}`);
}

</script></body>
</html>
